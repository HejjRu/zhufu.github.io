<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给朋友的祝福</title>
    <style>
        body {
            background-color: #000;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: "宋体", SimSun, sans-serif; /* 改为宋体 */
            position: relative;
        }
        /* 红字容器 */
        .red-text {
            color: #f00;
            font-size: 3.5vw;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            opacity: 0;
            animation: showRed 2s forwards;
            font-family: "宋体", SimSun, sans-serif; /* 红字也改为宋体 */
        }
        /* 白字容器 */
        .word {
            color: #fff;
            position: absolute;
            opacity: 0;
            z-index: 1;
            white-space: nowrap; /* 防止文字换行导致尺寸计算错误 */
            padding: 4px 8px; /* 增加内边距，避免文字边缘重叠 */
            font-family: "宋体", SimSun, sans-serif; /* 白字改为宋体 */
        }
        /* 红字显示动画 */
        @keyframes showRed {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        /* 白字浮现动画 */
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        /* 音乐控制按钮样式（可选） */
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            background: rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 20px;
            font-family: "宋体", SimSun, sans-serif;
        }
        /* 强制触发音频播放的遮罩（首次加载时） */
        .audio-trigger-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 20px;
            font-family: "宋体", SimSun, sans-serif;
        }
    </style>
</head>
<body>
    <!-- 强制触发音频的遮罩（首次加载显示） -->
    <div class="audio-trigger-mask" id="audio-mask">
        点击页面任意位置开始 ✨
    </div>

    <!-- 红字内容 -->
    <div class="red-text">我希望我的朋友都能...</div>

    <!-- 背景音乐元素：移除loop属性，仅播放一次 -->
    <audio id="bg-music">
        <source src="./Distress - Broken heart.MP3" type="audio/mpeg">
        您的浏览器不支持音频播放
    </audio>

    <!-- 音乐控制按钮（可选，方便暂停/播放） -->
    <div class="music-control" id="music-btn">🎵 暂停音乐</div>

    <script>
        // 祝福词汇列表
        const words = [
            "爱自己", "秋安", "飒爽", "开心", "相信自己", "健康", "暴富", "平安",
            "秋绥冬禧", "奋进", "不熬夜", "独立", "发大财", "平安喜乐", "顺颂时祺",
            "被爱", "顺遂", "自信大方", "温暖", "与自己和解", "快乐", "有远见", "独立清醒",
            "惬意温馨", "不为破事焦虑", "勇敢", "前程似锦", "心想事成", "从容",
            "内心丰盈", "有上进心", "如愿以偿", "做自己", "笑口常开", "一路繁花",
            "欢愉", "有人爱", "美丽", "爱笑", "明媚", "不负韶华",
            "安康", "有耐心", "阳光", "行稳致远", "向阳而生", "闪闪发光",
            "赤城", "自律", "积极向上", "财运亨通", "学业有成",
            "称心", "有野心", "有主见", "生活愉快", "工作顺利",
            "摆脱焦虑", "沉稳", "心态好", "万事顺遂", "未来可期",
            "积极", "认真", "活泼", "努力", "好好吃饭",
            "少点内耗", "拼搏", "有执行力", "有激情", "有自己的爱好",
            "坚强", "细心", "勤奋", "舒心", "接受所有的自己",
            "有爱心", "热爱生活", "乐观", "在生活中披荆斩棘", "内观自己",
            "没有烦恼", "开朗", "有想法", "清醒", "向前看",
            "漂亮", "不焦虑", "作息规律", "绮梦", "乘风破浪",
            "多金", "不被定义", "乐观面对生活", "睿智", "鹏程乘风",
            "富足", "毕业快乐", "做事果断", "豁达", "坚韧",
            "有魅力", "好运爆棚", "睡个好觉", "通透", "璀璨",
            "一帆风顺", "顺顺顺利", "无忧", "步履不停", "温暖明亮"
        ];

        // ========== 音乐播放逻辑（仅播放一次） ==========
        const audio = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        const audioMask = document.getElementById('audio-mask');
        let isMusicPlaying = false;
        let musicEnded = false; // 标记音乐是否播放完毕

        // 强制触发播放：通过遮罩引导用户点击，点击后播放音乐（仅一次）
        function initMusic() {
            // 监听遮罩点击事件（强制触发播放）
            audioMask.addEventListener('click', async () => {
                try {
                    // 强制播放音频（仅一次）
                    await audio.play();
                    isMusicPlaying = true;
                    musicBtn.textContent = "🎵 暂停音乐";
                    // 隐藏遮罩，展示主内容
                    audioMask.style.display = 'none';
                    
                    // 初始化文字生成
                    setTimeout(createWords, 100);
                } catch (err) {
                    alert("音乐播放失败，请检查文件路径或浏览器权限！");
                    console.error("音乐播放失败:", err);
                    // 即使播放失败也展示主内容
                    audioMask.style.display = 'none';
                    setTimeout(createWords, 100);
                }
            }, { once: true });

            // 监听音乐播放结束事件
            audio.addEventListener('ended', () => {
                isMusicPlaying = false;
                musicEnded = true;
                musicBtn.textContent = "🎵 重新播放";
            });

            // 音乐控制按钮点击事件
            musicBtn.addEventListener('click', () => {
                if (musicEnded) {
                    // 音乐已播放完毕，点击则重新播放
                    audio.currentTime = 0; // 重置播放进度
                    audio.play();
                    isMusicPlaying = true;
                    musicEnded = false;
                    musicBtn.textContent = "🎵 暂停音乐";
                } else if (isMusicPlaying) {
                    // 音乐播放中，点击暂停
                    audio.pause();
                    isMusicPlaying = false;
                    musicBtn.textContent = "🎵 播放音乐";
                } else {
                    // 音乐暂停中，点击继续播放
                    audio.play();
                    isMusicPlaying = true;
                    musicBtn.textContent = "🎵 暂停音乐";
                }
            });
        }

        // ========== 文字生成逻辑（大小随机+宋体） ==========
        // 存储已生成文字的位置和尺寸信息，用于碰撞检测
        let placedWords = [];

        // 检测新位置是否与已有文字/红字区域重叠
        function isOverlap(x, y, width, height, redRect) {
            // 检测与红字区域重叠
            if (
                x < redRect.right + 20 &&
                x + width > redRect.left - 20 &&
                y < redRect.bottom + 20 &&
                y + height > redRect.top - 20
            ) {
                return true;
            }

            // 检测与已有白字重叠
            for (const word of placedWords) {
                if (
                    x < word.x + word.width + 10 &&  // 增加10px间距避免紧贴
                    x + width > word.x - 10 &&
                    y < word.y + word.height + 10 &&
                    y + height > word.y - 10
                ) {
                    return true;
                }
            }
            return false;
        }

        // 生成随机位置+随机大小的文字（确保不重叠）
        function createWords() {
            const body = document.body;
            const redText = document.querySelector('.red-text');
            const redRect = redText.getBoundingClientRect();
            const bodyWidth = window.innerWidth;
            const bodyHeight = window.innerHeight;

            // 计算白字总显示时长（红字2秒后开始，8秒内完成所有白字显示）
            const totalDisplayTime = 8000; // 8秒完成所有白字浮现
            const interval = totalDisplayTime / words.length; // 平均间隔

            words.forEach((word, index) => {
                const wordEl = document.createElement('div');
                wordEl.className = 'word';
                wordEl.textContent = word;
                
                // 随机字体大小（范围：20px ~ 36px，调整后更大更明显）
                const randomFontSize = Math.floor(Math.random() * 17) + 20; 
                // 响应式适配：小屏幕最小20px，大屏幕最大36px
                const fontSize = `${Math.min(randomFontSize, Math.max(20, randomFontSize * (window.innerWidth / 1920)))}px`;
                wordEl.style.fontSize = fontSize;
                
                // 先添加到页面（不可见），用于计算实际尺寸
                body.appendChild(wordEl);
                wordEl.style.opacity = '0'; // 临时隐藏
                const wordRect = wordEl.getBoundingClientRect();
                const wordWidth = wordRect.width;
                const wordHeight = wordRect.height;

                // 寻找不重叠的随机位置（最多尝试100次，避免死循环）
                let x, y;
                let attempts = 0;
                do {
                    x = Math.random() * (bodyWidth - wordWidth - 40) + 20;
                    y = Math.random() * (bodyHeight - wordHeight - 40) + 20;
                    attempts++;
                    // 超过100次尝试则放宽限制（避免极端情况无法放置）
                    if (attempts > 100) break;
                } while (isOverlap(x, y, wordWidth, wordHeight, redRect));

                // 记录已放置文字的位置和尺寸
                placedWords.push({ x, y, width: wordWidth, height: wordHeight });

                // 设置最终位置
                wordEl.style.left = `${x}px`;
                wordEl.style.top = `${y}px`;

                // 计算当前文字的显示时间（2秒后开始，按顺序均匀分布在8秒内）
                const delay = 2000 + index * interval + (Math.random() * 200 - 100); // 增加±100ms随机波动

                // 设置动画（确保10秒内全部完成）
                setTimeout(() => {
                    wordEl.style.animation = 'fadeIn 0.8s forwards';
                }, delay);
            });
        }

        // 页面加载后初始化
        window.addEventListener('load', () => {
            // 初始化音乐播放（强制触发）
            initMusic();
            // 红字动画正常执行（即使音乐未播放，红字也会显示）
            redText.style.animation = 'showRed 2s forwards';
        });

        // 窗口大小变化时重新生成（可选）
        window.addEventListener('resize', () => {
            // 清空原有白字
            document.querySelectorAll('.word').forEach(el => el.remove());
            placedWords = [];
            if (audioMask.style.display === 'none') { // 只有遮罩隐藏后才重新生成
                createWords();
            }
        });
    </script>
</body>
</html>
